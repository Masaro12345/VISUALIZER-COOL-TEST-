<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Visualizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar for compact layout */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.5);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(99, 102, 241, 0.8);
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen w-screen overflow-hidden select-none font-sans">

    <!-- Canvas Container -->
    <div id="canvas-container" class="absolute inset-0 w-full h-full">
        <canvas id="visualizer-canvas" class="w-full h-full block"></canvas>
    </div>

    <!-- Mode Indicator Badge & Quick Copy Bar -->
    <div class="absolute top-4 left-4 right-4 z-20 flex items-center justify-between pointer-events-none">
        <span id="mode-badge" class="pointer-events-auto px-3 py-1 rounded-full text-xs font-semibold tracking-wide uppercase glass-panel text-indigo-400 border-indigo-500/30 shadow-lg transition-all duration-300">
            Desktop Mode
        </span>
        
        <!-- Top Quick Copy Button -->
        <button id="quick-copy-config-btn" class="pointer-events-auto glass-panel hover:bg-slate-800 text-xs text-slate-300 hover:text-white px-3 py-1.5 rounded-lg border border-slate-700 transition-all flex items-center gap-1.5 active:scale-95">
            <svg class="w-3.5 h-3.5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path>
            </svg>
            <span id="quick-copy-text">Copy Settings</span>
        </button>
    </div>

    <!-- Floating Spaced Menu Container -->
    <div class="absolute inset-0 pointer-events-none z-10 flex flex-col justify-between p-4 sm:p-6">
        
        <!-- Top Control Bar (Empty spacer) -->
        <div class="flex justify-end pointer-events-auto"></div>

        <!-- Bottom Controls Glass Panel -->
        <div id="menu-panel" class="pointer-events-auto glass-panel rounded-2xl p-4 sm:p-6 shadow-2xl max-h-[85vh] overflow-y-auto max-w-2xl mx-auto w-full transition-all duration-300">
            
            <div class="flex flex-col gap-6">
                <!-- Header -->
                <div class="flex items-center justify-between border-b border-slate-700/50 pb-3">
                    <h1 class="text-lg sm:text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-pink-400">
                        Visualizer Studio
                    </h1>
                    <span id="status-text" class="text-xs text-slate-400 font-mono">Ready</span>
                </div>

                <!-- Main Action Controls Grid -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- Audio Input Source -->
                    <div class="flex flex-col gap-2">
                        <label class="text-xs font-medium text-slate-300 uppercase tracking-wider">Audio Source</label>
                        <button id="mic-btn" class="w-full py-2.5 px-4 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 font-medium rounded-xl text-sm transition-all shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                            Start Microphone
                        </button>
                    </div>

                    <!-- Visualizer Style Selector -->
                    <div class="flex flex-col gap-2">
                        <label class="text-xs font-medium text-slate-300 uppercase tracking-wider">Preset Mode</label>
                        <select id="preset-select" class="w-full py-2.5 px-3 bg-slate-800/80 border border-slate-700 rounded-xl text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition-colors cursor-pointer">
                            <option value="bars">Classic Frequency Bars</option>
                            <option value="wave">Oscilloscope Wave</option>
                            <option value="radial">Radial Burst</option>
                        </select>
                    </div>
                </div>

                <!-- Sliders Section with Roomy Spacing -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 pt-2">
                    <div class="flex flex-col gap-2">
                        <div class="flex justify-between text-xs">
                            <span class="text-slate-300 font-medium uppercase tracking-wider">Sensitivity</span>
                            <span id="sensitivity-val" class="text-indigo-400 font-mono">1.5</span>
                        </div>
                        <input id="sensitivity" type="range" min="0.5" max="3" step="0.1" value="1.5" class="w-full accent-indigo-500 bg-slate-800 h-2 rounded-lg cursor-pointer">
                    </div>

                    <div class="flex flex-col gap-2">
                        <div class="flex justify-between text-xs">
                            <span class="text-slate-300 font-medium uppercase tracking-wider">Smoothing</span>
                            <span id="smoothing-val" class="text-indigo-400 font-mono">0.8</span>
                        </div>
                        <input id="smoothing" type="range" min="0.1" max="0.95" step="0.05" value="0.8" class="w-full accent-indigo-500 bg-slate-800 h-2 rounded-lg cursor-pointer">
                    </div>
                </div>

                <!-- Copy Config Section -->
                <div class="pt-2 border-t border-slate-700/50 flex flex-col sm:flex-row gap-3 items-center justify-between">
                    <span class="text-xs text-slate-400">Export active configuration parameters:</span>
                    <button id="copy-json-btn" class="w-full sm:w-auto px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-xs font-medium border border-slate-600 transition-all flex items-center justify-center gap-2 active:scale-95">
                        <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
                        </svg>
                        <span id="copy-json-text">Copy Full Config JSON</span>
                    </button>
                </div>

            </div>
        </div>
    </div>

    <script>
        // Canvas & Audio Context Setup
        const canvas = document.getElementById('visualizer-canvas');
        const ctx = canvas.getContext('2d');
        const modeBadge = document.getElementById('mode-badge');
        const micBtn = document.getElementById('mic-btn');
        const statusText = document.getElementById('status-text');
        const presetSelect = document.getElementById('preset-select');
        const sensitivityInput = document.getElementById('sensitivity');
        const sensitivityVal = document.getElementById('sensitivity-val');
        const smoothingInput = document.getElementById('smoothing');
        const smoothingVal = document.getElementById('smoothing-val');

        const quickCopyBtn = document.getElementById('quick-copy-config-btn');
        const quickCopyText = document.getElementById('quick-copy-text');
        const copyJsonBtn = document.getElementById('copy-json-btn');
        const copyJsonText = document.getElementById('copy-json-text');

        let audioCtx = null;
        let analyser = null;
        let dataArray = null;
        let isListening = false;
        let animationId = null;

        // Force desktop visual scale even under compact dimensions
        let isDesktopOverride = false;

        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            ctx.scale(dpr, dpr);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Detect window minimization & enforce Desktop Mode instantly
        function handleVisibilityChange() {
            if (document.hidden || document.visibilityState === 'hidden') {
                isDesktopOverride = true;
                modeBadge.textContent = "Desktop Mode (Forced)";
                modeBadge.className = "px-3 py-1 rounded-full text-xs font-semibold tracking-wide uppercase glass-panel text-emerald-400 border-emerald-500/30 shadow-lg transition-all duration-300";
            } else {
                isDesktopOverride = false;
                modeBadge.textContent = "Desktop Mode";
                modeBadge.className = "px-3 py-1 rounded-full text-xs font-semibold tracking-wide uppercase glass-panel text-indigo-400 border-indigo-500/30 shadow-lg transition-all duration-300";
            }
        }

        document.addEventListener('visibilitychange', handleVisibilityChange);
        window.addEventListener('blur', () => {
            handleVisibilityChange();
        });

        // Copy Helper Function
        function copyToClipboard(text, targetTextElem, successMsg) {
            navigator.clipboard.writeText(text).then(() => {
                const originalText = targetTextElem.textContent;
                targetTextElem.textContent = successMsg;
                setTimeout(() => {
                    targetTextElem.textContent = originalText;
                }, 2000);
            }).catch(err => {
                console.error("Failed to copy:", err);
            });
        }

        function getConfigData() {
            return {
                preset: presetSelect.value,
                sensitivity: parseFloat(sensitivityInput.value),
                smoothing: parseFloat(smoothingInput.value),
                mode: modeBadge.textContent,
                status: statusText.textContent,
                timestamp: new Date().toISOString()
            };
        }

        quickCopyBtn.addEventListener('click', () => {
            const config = getConfigData();
            const textToCopy = `Visualizer Preset: ${config.preset} | Sensitivity: ${config.sensitivity} | Smoothing: ${config.smoothing}`;
            copyToClipboard(textToCopy, quickCopyText, "Copied!");
        });

        copyJsonBtn.addEventListener('click', () => {
            const config = getConfigData();
            copyToClipboard(JSON.stringify(config, null, 2), copyJsonText, "JSON Copied!");
        });

        // Initialize Audio Input
        async function toggleAudio() {
            if (isListening) {
                if (audioCtx) audioCtx.close();
                isListening = false;
                micBtn.textContent = 'Start Microphone';
                micBtn.className = "w-full py-2.5 px-4 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 font-medium rounded-xl text-sm transition-all shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2";
                statusText.textContent = 'Stopped';
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256;
                analyser.smoothingTimeConstant = parseFloat(smoothingInput.value);

                const source = audioCtx.createMediaStreamSource(stream);
                source.connect(analyser);

                const bufferLength = analyser.frequencyBinCount;
                dataArray = new Uint8Array(bufferLength);

                isListening = true;
                micBtn.textContent = 'Stop Microphone';
                micBtn.className = "w-full py-2.5 px-4 bg-rose-600 hover:bg-rose-500 active:bg-rose-700 font-medium rounded-xl text-sm transition-all shadow-lg shadow-rose-600/30 flex items-center justify-center gap-2";
                statusText.textContent = 'Active';

                render();
            } catch (err) {
                console.error("Audio access error:", err);
                statusText.textContent = 'Mic Access Denied';
            }
        }

        micBtn.addEventListener('click', toggleAudio);

        // Control Listeners
        sensitivityInput.addEventListener('input', (e) => {
            sensitivityVal.textContent = e.target.value;
        });

        smoothingInput.addEventListener('input', (e) => {
            smoothingVal.textContent = e.target.value;
            if (analyser) analyser.smoothingTimeConstant = parseFloat(e.target.value);
        });

        // Drawing Functions (Original High Performance Render Engine)
        function render() {
            if (!isListening) return;

            animationId = requestAnimationFrame(render);
            analyser.getByteFrequencyData(dataArray);

            const width = window.innerWidth;
            const height = window.innerHeight;
            const sensitivity = parseFloat(sensitivityInput.value);
            const preset = presetSelect.value;

            ctx.clearRect(0, 0, width, height);

            if (preset === 'bars') {
                const barWidth = (width / dataArray.length) * 2.5;
                let x = 0;

                for (let i = 0; i < dataArray.length; i++) {
                    const barHeight = (dataArray[i] / 255) * height * 0.7 * sensitivity;

                    const gradient = ctx.createLinearGradient(0, height, 0, height - barHeight);
                    gradient.addColorStop(0, '#6366f1');
                    gradient.addColorStop(0.5, '#a855f7');
                    gradient.addColorStop(1, '#ec4899');

                    ctx.fillStyle = gradient;
                    ctx.fillRect(x, height - barHeight, barWidth - 2, barHeight);

                    x += barWidth;
                }
            } else if (preset === 'wave') {
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#38bdf8';
                ctx.beginPath();

                const sliceWidth = width / dataArray.length;
                let x = 0;

                for (let i = 0; i < dataArray.length; i++) {
                    const v = (dataArray[i] / 128.0) * sensitivity;
                    const y = (v * height) / 2;

                    if (i === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }

                    x += sliceWidth;
                }

                ctx.lineTo(width, height / 2);
                ctx.stroke();
            } else if (preset === 'radial') {
                const centerX = width / 2;
                const centerY = height / 2;
                const radius = Math.min(width, height) * 0.2;

                for (let i = 0; i < dataArray.length; i++) {
                    const angle = (i / dataArray.length) * Math.PI * 2;
                    const barLength = (dataArray[i] / 255) * radius * sensitivity;

                    const x1 = centerX + Math.cos(angle) * radius;
                    const y1 = centerY + Math.sin(angle) * radius;
                    const x2 = centerX + Math.cos(angle) * (radius + barLength);
                    const y2 = centerY + Math.sin(angle) * (radius + barLength);

                    ctx.strokeStyle = `hsl(${(i / dataArray.length) * 360}, 80%, 60%)`;
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.stroke();
                }
            }
        }
    </script>
</body>
</html>
