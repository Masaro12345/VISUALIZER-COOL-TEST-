<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DART VIZ - Ultimate Audio Visualizer (Remixed Edition)</title>
<style>
  :root {
    --panel-bg: rgba(8, 12, 22, 0.92);
    --panel-border: rgba(72, 160, 255, 0.25);
    --accent: #00d2ff;
    --ok: #00ffaa;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #02060f;
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  /* --- CINEMATIC INTRO SCREEN & BOOT SYSTEM --- */
  #intro-screen {
    position: fixed; inset: 0; z-index: 99999;
    background: #02060f;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  #intro-screen.fade-out {
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity 0.9s ease, visibility 0.9s ease;
  }
  #intro-canvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
  }
  .intro-content {
    position: relative; z-index: 2;
    text-align: center;
    display: flex; flex-direction: column; align-items: center;
    transition: opacity 0.5s ease, transform 0.9s cubic-bezier(0.5, 0, 0.2, 1);
  }
  .intro-content.leaving {
    opacity: 0; transform: scale(1.25);
  }
  .intro-logo {
    width: 84px; height: 84px;
    opacity: 0;
    animation: logoIn 1.3s 0.15s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  @keyframes logoIn {
    from { opacity: 0; transform: scale(0.2) rotate(-120deg); filter: blur(10px); }
    to { opacity: 1; transform: none; filter: drop-shadow(0 0 22px rgba(0, 255, 170, 0.8)); }
  }
  .intro-title {
    display: flex;
    color: #e0f2fe; font-size: 44px; font-weight: 800;
    letter-spacing: 0.14em; margin: 18px 0 4px;
    text-shadow: 0 0 18px rgba(0, 210, 255, 0.5);
    white-space: pre;
  }
  .intro-title span {
    display: inline-block; opacity: 0;
    animation: letterIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  @keyframes letterIn {
    from { opacity: 0; transform: translateY(34px) scale(1.7); filter: blur(14px); }
    to { opacity: 1; transform: none; filter: blur(0); }
  }
  .intro-subtitle {
    color: var(--ok); font-size: 11px; letter-spacing: 0.35em;
    margin: 0 0 22px; opacity: 0;
    animation: fadeUp 1s 1.5s ease forwards;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 0.85; transform: none; }
  }
  .boot-bar {
    width: 240px; height: 2px;
    background: rgba(0, 210, 255, 0.15);
    border-radius: 2px; overflow: hidden;
  }
  .boot-bar i {
    display: block; height: 100%; width: 0;
    background: linear-gradient(90deg, #00ffaa, #00d2ff);
    box-shadow: 0 0 10px #00d2ff;
  }
  .boot-line {
    font: 600 10px ui-monospace, Consolas, monospace;
    letter-spacing: 0.2em; color: rgba(0, 255, 170, 0.85);
    min-height: 14px; margin: 10px 0 18px;
  }
  #intro-start-btn {
    background: transparent; border: 1px solid var(--accent); color: var(--accent);
    padding: 12px 30px; font-size: 13px; font-weight: 700; letter-spacing: 0.2em;
    border-radius: 30px; cursor: pointer; opacity: 0; transform: translateY(8px);
    pointer-events: none; transition: opacity 0.6s, transform 0.6s, background 0.3s, box-shadow 0.3s, color 0.3s;
  }
  #intro-start-btn.ready {
    opacity: 1; transform: none; pointer-events: auto;
    animation: btnPulse 2s infinite alternate;
  }
  @keyframes btnPulse {
    from { box-shadow: 0 0 8px rgba(0, 210, 255, 0.2); }
    to { box-shadow: 0 0 28px rgba(0, 210, 255, 0.6); }
  }
  #intro-start-btn:hover {
    background: var(--accent); color: #02060f;
    box-shadow: 0 0 30px rgba(0, 210, 255, 0.8);
  }
  #intro-skip-btn {
    background: none; border: 0; color: rgba(180, 220, 255, 0.45);
    font-size: 11px; letter-spacing: 0.12em; margin-top: 14px;
    cursor: pointer; opacity: 0; pointer-events: none;
    transition: opacity 0.6s, color 0.2s;
  }
  #intro-skip-btn.ready { opacity: 1; pointer-events: auto; }
  #intro-skip-btn:hover { color: #e0f2fe; }
  #intro-flash {
    position: absolute; inset: 0; z-index: 3; pointer-events: none; opacity: 0;
    background: radial-gradient(circle, #fff 0%, #00e1ff 35%, transparent 70%);
  }
  #intro-flash.go { animation: flashAnim 0.9s ease-out; }
  @keyframes flashAnim {
    0% { opacity: 0; } 15% { opacity: 0.85; } 100% { opacity: 0; }
  }

  /* --- BRAND LOGO & CONTROLS --- */
  #panel.intro-hold { opacity: 0; visibility: hidden; transform: translateX(-50%) translateY(-28px); pointer-events: none; }
  #brand-logo-container.intro-hold, #toggle-panel.intro-hold, #status.intro-hold { opacity: 0 !important; pointer-events: none; }
  
  #brand-logo-container {
    position: fixed; top: 20px; left: 20px; z-index: 100;
    display: flex; align-items: center; gap: 12px; padding: 8px 14px;
    background: rgba(8, 12, 22, 0.75); border: 1px solid rgba(0, 210, 255, 0.2);
    border-radius: 12px; backdrop-filter: blur(8px);
    transition: opacity 1.5s, visibility 1.5s, transform 0.3s;
  }
  #brand-logo-container:hover { opacity: 1 !important; visibility: visible !important; transform: translateY(-2px); }
  #brand-logo-container.faded { opacity: 0; visibility: hidden; }
  .brand-logo-svg { width: 32px; height: 32px; filter: drop-shadow(0 0 6px rgba(0, 255, 170, 0.6)); }
  .brand-text-wrap { display: flex; flex-direction: column; }
  .brand-title { color: #e0f2fe; font-size: 14px; font-weight: 700; letter-spacing: 0.05em; line-height: 1.1; }
  .brand-subtitle { color: var(--ok); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.8; }

  #video-stage { position: fixed; inset: 0; overflow: hidden; background: #02060f; z-index: 1; }
  #video-stage iframe { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; border: 0; }
  #placeholder-msg {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    z-index: 2; color: rgba(180, 220, 255, 0.6); font-size: 15px; text-align: center; max-width: 420px; line-height: 1.6;
  }
  #vignette {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background: radial-gradient(circle at center, rgba(2,6,15,0) 40%, rgba(2,6,15,0.7) 100%),
                linear-gradient(to top, rgba(2,6,15,0.9) 0%, rgba(2,6,15,0.3) 30%, rgba(2,6,15,0) 60%);
  }

  #viz-wrap { position: fixed; inset: 0; z-index: 4; width: 100vw; height: 100vh; pointer-events: none; will-change: transform; }
  #viz-canvas { width: 100%; height: 100%; display: block; }

  /* --- SCROLLABLE CONTROL PANEL --- */
  #panel {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    z-index: 10; background: var(--panel-bg); border: 1px solid var(--panel-border);
    border-radius: 12px; padding: 14px 20px;
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    max-width: 95vw; max-height: calc(100vh - 40px);
    overflow-y: auto; overflow-x: hidden;
    transition: opacity 0.9s ease, transform 0.9s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.2s;
    box-shadow: 0 8px 32px rgba(0, 180, 255, 0.08);
  }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(0, 210, 255, 0.35); border-radius: 4px; }
  
  #panel input[type=text] {
    background: rgba(0, 150, 255, 0.08); border: 1px solid rgba(0, 210, 255, 0.25);
    color: #e0f2fe; padding: 10px 14px; border-radius: 8px; font-size: 13px; width: 180px; outline: none;
  }
  #panel input[type=text]:focus { border-color: var(--accent); background: rgba(0, 150, 255, 0.16); }
  #panel input[type=text]::placeholder { color: rgba(180, 220, 255, 0.4); }
  
  #panel button, #panel select {
    background: #080d18; border: 1px solid rgba(0, 210, 255, 0.35);
    color: var(--accent); padding: 10px 12px; border-radius: 8px; font-size: 13px; cursor: pointer;
    transition: all 0.2s; white-space: nowrap; font-weight: 600;
  }
  #panel select option { background: #080d18; color: #e0f2fe; }
  #panel select option:disabled { color: var(--ok); font-weight: 700; }
  #panel button:hover { background: rgba(0, 210, 255, 0.22); border-color: rgba(0, 210, 255, 0.6); }
  
  #fav-btn.active { color: #ffd700; border-color: #ffd700; background: rgba(255, 215, 0, 0.15); }
  #folder-btn.linked { color: var(--ok); border-color: var(--ok); }
  #folder-btn.warn { color: #ffb347; border-color: #ffb347; }

  .fav-pagination-group {
    display: flex; align-items: center; gap: 4px;
    background: #080d18; border: 1px solid rgba(0, 210, 255, 0.35);
    border-radius: 8px; padding: 2px 6px;
  }
  .fav-pagination-group select { border: none !important; background: transparent !important; padding: 8px 4px !important; }
  .fav-page-btn { padding: 6px 8px !important; font-size: 11px !important; border-radius: 6px !important; }
  .fav-page-num { color: var(--ok); font-size: 11px; font-weight: 700; min-width: 34px; text-align: center; }

  .scrubber-group {
    display: flex; align-items: center; gap: 10px; width: 100%;
    margin-top: 6px; padding: 4px 8px; background: rgba(0, 210, 255, 0.05);
    border: 1px solid rgba(0, 210, 255, 0.15); border-radius: 8px;
  }
  .scrubber-time { font-size: 11px; color: var(--ok); font-weight: 600; min-width: 45px; text-align: center; font-family: monospace; }
  #time-slider {
    flex: 1; -webkit-appearance: none; appearance: none; height: 6px;
    background: rgba(0, 210, 255, 0.2); border-radius: 3px; outline: none; cursor: pointer;
  }
  #time-slider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 14px; height: 14px;
    border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); cursor: pointer;
  }

  #preview-card {
    position: fixed; top: 180px; left: 50%; transform: translateX(-50%);
    z-index: 12; background: rgba(6, 12, 24, 0.95); border: 1px solid var(--accent);
    border-radius: 10px; padding: 10px; width: 280px; display: none;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8); text-align: center; pointer-events: none;
  }
  #preview-card img { width: 100%; height: 140px; object-fit: cover; border-radius: 6px; }
  #preview-card .title { color: #e0f2fe; font-size: 12px; margin-top: 8px; font-weight: 600; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

  #status {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
    z-index: 10; font-size: 12px; color: var(--accent); text-align: center; max-width: 520px;
    background: rgba(4, 14, 30, 0.85); border: 1px solid rgba(0, 210, 255, 0.25);
    padding: 6px 14px; border-radius: 20px; transition: opacity 1.2s, visibility 1.2s;
  }
  #status.faded { opacity: 0; visibility: hidden; }
  #status:hover { opacity: 1 !important; visibility: visible !important; }

  #toggle-panel {
    position: fixed; top: 20px; right: 20px; z-index: 11;
    background: var(--panel-bg); border: 1px solid var(--panel-border);
    color: #e0f2fe; width: 40px; height: 40px; border-radius: 50%;
    cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center;
  }
  #toggle-panel:hover { background: rgba(0, 210, 255, 0.2); }
  #panel.hidden { opacity: 0; visibility: hidden; transform: translateX(-50%) translateY(-10px); }
  #status.hidden { display: none; }
  #snare-flash { position: fixed; inset: 0; z-index: 5; pointer-events: none; background: #00e1ff; opacity: 0; mix-blend-mode: screen; will-change: opacity; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="g1" x1="0%" y1="100%" x2="100%" y2="0%"><stop offset="0%" stop-color="#00ffaa"/><stop offset="100%" stop-color="#00d2ff"/></linearGradient>
  <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#aa00ff"/><stop offset="100%" stop-color="#00ffaa"/></linearGradient>
</defs></svg>

<!-- CINEMATIC BOOT SCREEN -->
<div id="intro-screen">
  <canvas id="intro-canvas"></canvas>
  <div class="intro-content" id="intro-content">
    <div class="intro-logo">
      <svg viewBox="0 0 64 64" fill="none">
        <path d="M12 52 L52 12 L36 52 L26 38 L12 52 Z" fill="url(#g1)"/>
        <path d="M52 12 L12 52 L52 36 L38 26 L52 12 Z" fill="url(#g2)" opacity=".85"/>
      </svg>
    </div>
    <h1 class="intro-title" id="intro-title" aria-label="DART VIZ"></h1>
    <p class="intro-subtitle">HYPER-REACTIVE AUDIO SYSTEM</p>
    <div class="boot-bar"><i id="boot-fill"></i></div>
    <div class="boot-line" id="boot-line">BOOTING SPECTRUM ENGINE...</div>
    <button id="intro-start-btn">INITIALIZE · ENABLE AUDIO</button>
    <button id="intro-skip-btn">start without audio</button>
  </div>
  <div id="intro-flash"></div>
</div>

<div id="brand-logo-container">
  <svg class="brand-logo-svg" viewBox="0 0 64 64" fill="none">
    <path d="M12 52 L52 12 L36 52 L26 38 L12 52 Z" fill="url(#g1)"/>
    <path d="M52 12 L12 52 L52 36 L38 26 L52 12 Z" fill="url(#g2)" opacity=".85"/>
    <polygon points="52,12 38,26 26,38" fill="#fff" opacity=".6"/>

  </svg>
  <div class="brand-text-wrap"><span class="brand-title">DART VIZ</span><span class="brand-subtitle">Audio-Visualizer</span></div>
</div>

<div id="video-stage">
  <div id="yt-player-target"></div>
  <div id="placeholder-msg">Paste a YouTube link or video ID above and hit Load<br>to set the background.</div>
</div>
<div id="vignette"></div>
<div id="snare-flash"></div>

<div id="preview-card"><img id="preview-img" src="" alt="Thumbnail"><div id="preview-title" class="title">Loading…</div></div>
<div id="viz-wrap"><canvas id="viz-canvas"></canvas></div>
<button id="toggle-panel" aria-label="Toggle Control Panel" title="Hide/show controls (H)">⋮</button>

<div id="panel">
  <input id="yt-input" type="text" placeholder="YouTube URL or video ID" aria-label="YouTube URL">
  <button id="load-btn">Load Video</button>
  <button id="skip-ad-btn" title="Reload stream to bypass ads">⏭️ Skip Ad / Reset</button>
  <button id="fav-btn" title="Save current video to Favorites">⭐ Favorite</button>

  <div class="fav-pagination-group">
    <button id="fav-prev-btn" class="fav-page-btn" title="Previous Page">◄</button>
    <select id="fav-select" aria-label="Favorites"><option value="" disabled selected>⭐ Favorites</option></select>
    <button id="fav-next-btn" class="fav-page-btn" title="Next Page">►</button>

  </div>

  <button id="folder-btn" title="Pick a folder (e.g. DART_VIZ_DATA on your Desktop). Favorites + history are auto-saved there.">📁 Set Backup Folder</button>
  <button id="save-file-btn" title="Download a backup file now">💾 Save File</button>
  <button id="export-list-btn" title="Copy Favorites with links and titles">📋 Copy List</button>
  <button id="import-list-btn" title="Import list from clipboard">📥 Paste List</button>
  <button id="load-file-btn" title="Restore from a backup file">📂 Load File</button>
  <input type="file" id="file-input" accept=".json,.txt" style="display:none">

  <select id="history-select" aria-label="History"><option value="" disabled selected>📜 History</option></select>
  <select id="speed-select" aria-label="Playback Speed">
    <option value="0.25">0.25x Speed</option><option value="0.5">0.5x Speed</option><option value="0.75">0.75x Speed</option>
    <option value="1" selected>1.0x Normal</option><option value="1.25">1.25x Speed</option><option value="1.5">1.5x Speed</option>
    <option value="1.75">1.75x Speed</option><option value="2">2.0x Speed</option>

  <select id="viz-style-select" aria-label="Visualizer Style">
    <option value="bars" selected>📊 Bars Style</option><option value="wave">⚡ Rapid Wave Style</option>
    <option value="sea_wave">🌊 Sea Waves Style</option><option value="radial">💫 Radial Ring Style</option>

  <button id="capture-btn" title="Open full source picker for Screen, Window, or Tab audio">Enable Real Audio-Reactive</button>

  <div class="scrubber-group">
    <span id="curr-time-display" class="scrubber-time">00:00</span>
    <input id="time-slider" type="range" min="0" max="100" value="0" step="0.1" aria-label="Seek">

<div id="status">Ambient mode running. Real mode requires sharing audio.</div>

<script>
(function(){
'use strict';
const $ = id => document.getElementById(id);
const ID_RE = /^[\w-]{11}$/;

/* ================================================================
   ROBUST 3-LAYER STORAGE SYSTEM (LocalStorage + IndexedDB + Folder)
   ================================================================ */
const Store = (() => {
  const LS_FAV='yt_viz_favorites', LS_HIST='yt_viz_history', LS_BAK='yt_viz_backup_copy';
  const MAIN_FILE='dart_viz_data.json', LIST_FILE='favorites_readable.txt';
  const HIST_MAX=25;
  const data = { favorites: [], history: [] };
  let dirHandle = null, dirOK = false, onChange = () => {}, timer = null;
  const folderSupported = typeof window.showDirectoryPicker === 'function';

  let dbp = null;
  const idb = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('dart_viz_db', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const idbGet = async k => { try { const db = await idb(); return await new Promise(res => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); }); } catch { return undefined; } };
  const idbSet = async (k, v) => { try { const db = await idb(); await new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); } catch {} };

  const clean = list => {
    const seen = new Set(), out = [];
    (Array.isArray(list) ? list : []).forEach(it => {
      const id = typeof it === 'string' ? extractVideoId(it) : (it && (ID_RE.test(it.id || '') ? it.id : extractVideoId(it.url || '')));
      if (!id || seen.has(id)) return;
      seen.add(id);
      out.push({ id, title: String((it && it.title) || 'YouTube Video').slice(0, 200) });
    });
    return out;
  };
  const merge = (a, b) => clean([...a, ...b]);
  const lsRead = k => { try { return JSON.parse(localStorage.getItem(k) || '[]'); } catch { return []; } };
  const snapshot = () => JSON.stringify({ app: 'DART VIZ', version: 2, savedAt: new Date().toISOString(), favorites: data.favorites, history: data.history }, null, 2);
  const readableList = () => data.favorites.map((f, i) => `${i + 1}. ${f.title}\n   https://youtu.be/${f.id}`).join('\n') + '\n';

  function absorb(obj) {
    if (!obj) return 0;
    const before = data.favorites.length;
    if (Array.isArray(obj)) data.favorites = merge(data.favorites, obj);
    else { data.favorites = merge(data.favorites, obj.favorites); data.history = merge(data.history, obj.history).slice(0, HIST_MAX); }
    return data.favorites.length - before;
  }

  async function perm(h, ask) {
    const o = { mode: 'readwrite' };
    try {
      if ((await h.queryPermission(o)) === 'granted') return true;
      if (ask && (await h.requestPermission(o)) === 'granted') return true;
    } catch {}
    return false;
  }
  async function writeFile(dir, name, text) {
    const fh = await dir.getFileHandle(name, { create: true });
    const w = await fh.createWritable(); await w.write(text); await w.close();
  }
  async function readFolder() {
    try {
      const fh = await dirHandle.getFileHandle(MAIN_FILE);
      return JSON.parse(await (await fh.getFile()).text());
    } catch { return null; }
  }
  async function writeFolder() {
    if (!dirHandle || !dirOK) return false;
    try {
      const text = snapshot();
      await writeFile(dirHandle, MAIN_FILE, text);
      await writeFile(dirHandle, LIST_FILE, readableList());
      const day = new Date().toISOString().slice(0, 10);
      const bak = await dirHandle.getDirectoryHandle('backups', { create: true });
      await writeFile(bak, `dart_viz_${day}.json`, text);
      return true;
    } catch { dirOK = false; onChange(); return false; }
  }

  async function persistAll() {
    try { localStorage.setItem(LS_FAV, JSON.stringify(data.favorites)); localStorage.setItem(LS_HIST, JSON.stringify(data.history)); localStorage.setItem(LS_BAK, snapshot()); } catch {}
    await idbSet('data', { favorites: data.favorites, history: data.history });
    await writeFolder();
  }
  function save() { clearTimeout(timer); timer = setTimeout(persistAll, 350); }
  function flushNow() { clearTimeout(timer); try { localStorage.setItem(LS_FAV, JSON.stringify(data.favorites)); localStorage.setItem(LS_HIST, JSON.stringify(data.history)); } catch {} persistAll(); }

  async function chooseFolder() {
    if (!folderSupported) return { ok: false, msg: 'Folder backup needs Chrome/Edge. Use 💾 Save File instead.' };
    try {
      const h = await window.showDirectoryPicker({ id: 'dartviz', mode: 'readwrite', startIn: 'desktop' });
      if (!(await perm(h, true))) return { ok: false, msg: 'Folder permission denied.' };
      dirHandle = h; dirOK = true;
      await idbSet('dirHandle', h);
      const added = absorb(await readFolder());
      await persistAll(); onChange();
      return { ok: true, msg: `Backup folder linked: ${h.name}` + (added ? ` (restored ${added} favorites)` : '') };
    } catch (e) { return { ok: false, msg: e && e.name === 'AbortError' ? 'Folder pick cancelled.' : 'Folder pick failed. Create a subfolder on Desktop first.' }; }
  }
  async function reconnect(ask) {
    if (!dirHandle) return false;
    dirOK = await perm(dirHandle, ask);

    const hue = (theme.hueBase + li * 12 + 360) % 360; let st, fi;
    if (theme.isBlack) { st = `rgba(30,41,59,${L.o})`; fi = `rgba(15,23,42,${L.o * .5})`; }
    else if (theme.isMonochrome) { st = `rgba(255,255,255,${L.o})`; fi = `rgba(220,220,220,${L.o * .15})`; }
    else { st = `hsla(${hue},${theme.sat}%,${60 + pulse * 15}%,${L.o})`; fi = `hsla(${hue},${theme.sat}%,35%,${L.o * .25})`; }
    ctx.beginPath(); ctx.lineWidth = 2.5 + pulse * 2; ctx.strokeStyle = st; ctx.fillStyle = fi; ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 6) {
      const t = sp * L.s;
      const base = Math.sin(x * L.f + t) + Math.cos(x * L.f * 1.6 - t * .8) * .45;
      const audio = (values[Math.floor(x / W * (HALF_BARS / 2))] || 0) * Math.max(30, H * .06);
      let ts = 0; const d = Math.abs(x - cx);
      for (const tp of tsunami) { const diff = Math.abs(d - tp.dist); if (diff < 100) ts += Math.cos(diff / 100 * 1.5708) * tp.maxAmp * tp.alpha; }
      const y = cy + L.y + base * swell * L.a - audio - ts * L.a;
      ctx.lineTo(x, y);
      if (li === 2 && Math.random() < .05) active.push({ x, y, hue });
    }
    ctx.lineTo(W, H); ctx.closePath(); ctx.fill(); ctx.stroke();
  });
  if (pulse > .15) spawnBeatParticles(active, pulse * .7, theme.isMonochrome, theme.isBlack);
  drawParticles();
}

function drawRadial(values, pulse, theme) {
  ctx.clearRect(0, 0, W, H);
  const cx = W / 2, cy = H / 2, base = Math.max(130, Math.min(W, H) * .24) + pulse * 20, maxLen = Math.max(90, Math.min(W, H) * .2), total = BAR_COUNT, peaks = [];
  radialRotation += .003 * (1 + pulse * .5);
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(radialRotation);
  const ring = theme.isBlack ? '#1e293b' : theme.isMonochrome ? '#fff' : `hsl(${theme.hueBase},${theme.sat}%,${60 + pulse * 20}%)`;
  ctx.beginPath(); ctx.arc(0, 0, base - 4, 0, 6.2832); ctx.lineWidth = 2 + pulse * 4; ctx.strokeStyle = ring; ctx.shadowBlur = 15 + pulse * 20; ctx.shadowColor = theme.isBlack ? '#000' : ring; ctx.stroke(); ctx.shadowBlur = 0;
  ctx.lineWidth = Math.max(2, Math.PI * base * 2 / total * .6);
  for (let i = 0; i < total; i++) {
    const vi = i < HALF_BARS ? i : total - 1 - i, v = values[vi], ang = i / total * 6.2832, len = Math.max(4, v * maxLen);
    const c = Math.cos(ang), s = Math.sin(ang), hue = (theme.hueBase + vi / HALF_BARS * theme.hueRange - pulse * 10 + 360) % 360;
    ctx.strokeStyle = theme.isBlack ? `hsl(0,0%,${Math.max(10, 30 - v * 20)}%)` : theme.isMonochrome ? `hsl(0,0%,${Math.min(100, 70 + v * 30)}%)` : `hsl(${hue},${theme.sat}%,${50 + v * 30}%)`;
    ctx.beginPath(); ctx.moveTo(c * base, s * base); ctx.lineTo(c * (base + len), s * (base + len)); ctx.stroke();
    if (v > .3) { const wa = ang + radialRotation; peaks.push({ x: cx + Math.cos(wa) * (base + len), y: cy + Math.sin(wa) * (base + len), hue, angle: wa }); }
  }
  ctx.restore();
  if (pulse > .15) spawnBeatParticles(peaks, pulse, theme.isMonochrome, theme.isBlack);
  drawParticles();
}

const applyCameraPulse = k => { vizWrap.style.transform = `scale(${1 + Math.min(.03, k * .03)})`; };
const applySnareFlash = s => { snareFlashEl.style.opacity = String(Math.min(.25, s * .25)); };
let vizGain = 1;
const gainBuf = new Float32Array(HALF_BARS);
function render(values, kick) {
  if (vizGain < .999) {
    for (let i = 0; i < HALF_BARS; i++) gainBuf[i] = values[i] * vizGain;
    values = gainBuf; kick *= vizGain; vizWrap.style.opacity = String(vizGain);
  } else if (vizWrap.style.opacity) vizWrap.style.opacity = '';
  if (vizStyle === 'wave') drawWave(kick, currentTheme);
  else if (vizStyle === 'sea_wave') drawSeaWave(values, kick, currentTheme);
  else if (vizStyle === 'radial') drawRadial(values, kick, currentTheme);
  else drawBars(values, kick, currentTheme);
}

function tickAmbient() {
  ambientPhase += .08 * currentSpeed; wobbleTime += .05 * currentSpeed;
  const kick = Math.pow(Math.max(0, Math.sin(ambientPhase * .5)), 10);
  const snare = Math.pow(Math.max(0, Math.sin(ambientPhase * .5 + 1.6)), 12);
  const hat = Math.max(0, Math.sin(ambientPhase * 3.1)) > .94;
  for (let i = 0; i < HALF_BARS; i++) {
    const b = Math.sin(ambientPhase + i * .2) * .5 + .5, w = Math.cos(ambientPhase * 2 + i * .1) * .2;
    renderValues[i] = Math.max(.04, Math.min(.85, b * .6 + w + .05 + kick * .3));
  }
  if (hat) spawnSparkles(.5, currentTheme.isMonochrome, currentTheme.isBlack);
  applyCameraPulse(kick); applySnareFlash(snare); render(renderValues, kick);
}

function tickReal() {
  analyser.getByteFrequencyData(dataArray); analyser.getByteTimeDomainData(timeDataArray);
  let frameMax = 0;
  for (let i = 0; i < HALF_BARS; i++) {
    const a = binIndices[i]; let b = binIndices[i + 1]; if (b <= a) b = a + 1;
    let sum = 0; for (let j = a; j < b; j++) sum += dataArray[j];
    let avg = sum / (b - a) / 255 * (1 + Math.pow(i / HALF_BARS, 1.8) * 2.2);
    if (avg > frameMax) frameMax = avg; rawValues[i] = avg;
  }
  peakVolume = Math.max(peakVolume * .992, frameMax, .15);
  const gain = 1 / peakVolume;
  let bass = 0; for (let i = 0; i < 6; i++) bass += rawValues[i]; bass /= 6;
  if (bass > .2 && bass - bassHistory > .07) kickPulse = 1; kickPulse = Math.max(0, kickPulse - .08); bassHistory = bassHistory * .75 + bass * .25;
  let mid = 0; for (let i = 12; i < 28; i++) mid += rawValues[i]; mid /= 16;
  if (mid > .16 && mid - snareHistory > .065) snarePulse = 1; snarePulse = Math.max(0, snarePulse - .15); snareHistory = snareHistory * .7 + mid * .3;
  let hi = 0; for (let i = HALF_BARS - 10; i < HALF_BARS; i++) hi += rawValues[i]; hi /= 10;
  if (hi > .12 && hi - hihatHistory > .05) hihatPulse = 1; hihatPulse = Math.max(0, hihatPulse - .22); hihatHistory = hihatHistory * .6 + hi * .4;
  for (let i = 0; i < HALF_BARS; i++) {
    const t = Math.min(1, rawValues[i] * gain * .85);
    smoothed[i] += (t - smoothed[i]) * (t > smoothed[i] ? .75 : (i < 10 ? .18 : .28));
  }
  wobbleTime += .05;
  if (hihatPulse > .4) spawnSparkles(hihatPulse, currentTheme.isMonochrome, currentTheme.isBlack);
  applyCameraPulse(kickPulse); applySnareFlash(snarePulse); render(smoothed, kickPulse);
}

function loop() {
  try { updateScrubber(); if (mode === 'real' && analyser) tickReal(); else tickAmbient(); } catch (e) { console.error(e); }
  requestAnimationFrame(loop);
}

/* ================================================================
   AUDIO REACTIVE CAPTURE (Remixed with Full Picker & Sharing Tag)
   ================================================================ */
async function enableRealAudio() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) { setStatus('Tab-audio capture is not supported here — ambient mode.', 5000); return false; }
  try {
    setStatus('Select Screen, Window, or Tab + ensure audio sharing is enabled.', 6000);
    // REMIX: Standard getDisplayMedia call restores full browser picker and status tag!
    const stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
    const tracks = stream.getAudioTracks();
    if (!tracks.length) { setStatus('No audio track shared! Staying in ambient mode.', 6000); stream.getTracks().forEach(t => t.stop()); return false; }
    stream.getVideoTracks().forEach(t => t.stop());
    if (audioCtx) { try { audioCtx.close(); } catch {} }
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const src = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser(); analyser.fftSize = 1024; analyser.smoothingTimeConstant = .35;
    dataArray = new Uint8Array(analyser.frequencyBinCount); timeDataArray = new Uint8Array(analyser.fftSize);
    updateBinIndices(analyser.frequencyBinCount, audioCtx.sampleRate);
    src.connect(analyser); mode = 'real'; setStatus('Audio-reactive mode engaged!');
    tracks[0].addEventListener('ended', () => { mode = 'ambient'; setStatus('Audio sharing ended — back to ambient.'); });
    return true;
  } catch { setStatus('Audio capture cancelled — ambient mode.'); return false; }
}
$('capture-btn').addEventListener('click', () => enableRealAudio());
$('sim-btn').addEventListener('click', () => { mode = 'ambient'; setStatus('Ambient mode running.'); });
const togglePanel = () => { panelEl.classList.toggle('hidden'); statusEl.classList.toggle('hidden'); };
$('toggle-panel').addEventListener('click', togglePanel);
addEventListener('keydown', e => { if ((e.key === 'h' || e.key === 'H') && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) togglePanel(); });

document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') Store.flushNow(); });
addEventListener('pagehide', () => Store.flushNow());

/* ---------------- CINEMATIC INTRO ANIMATION ---------------- */
const Intro = (() => {
  const el = $('intro-screen'), cv = $('intro-canvas'), c = cv.getContext('2d'), content = $('intro-content'), flash = $('intro-flash');
  const startBtn = $('intro-start-btn'), skipBtn = $('intro-skip-btn'), bootFill = $('boot-fill'), bootLine = $('boot-line'), titleEl = $('intro-title');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const held = [panelEl, statusEl, $('toggle-panel'), $('brand-logo-container')];
  const queue = [], sleep = ms => new Promise(r => setTimeout(r, ms)), ease = x => 1 - Math.pow(1 - x, 3), clamp = x => Math.min(1, Math.max(0, x));
  let w = 0, h = 0, t0 = performance.now(), raf = 0, state = 'boot', launchAt = 0, ready = false, finished = false;

  'DART VIZ'.split('').forEach((ch, i) => { const s = document.createElement('span'); s.textContent = ch; s.style.animationDelay = (.5 + i * .09) + 's'; if (ch === ' ') s.style.width = '.35em'; titleEl.appendChild(s); });
  const N = reduce ? 50 : 180, B = 72;
  const P = Array.from({ length: N }, () => ({ a: Math.random() * 6.2832, d: .35 + Math.random() * .9, s: .3 + Math.random() * .9, hue: 165 + Math.random() * 60, o: Math.random() }));
  function size() { const dpr = Math.min(devicePixelRatio || 1, 2); w = innerWidth; h = innerHeight; cv.width = w * dpr; cv.height = h * dpr; c.setTransform(dpr, 0, 0, dpr, 0, 0); }
  addEventListener('resize', size); size();

  function frame(now) {
    raf = requestAnimationFrame(frame);
    const t = (now - t0) / 1000, L = state === 'launch' ? (now - launchAt) / 1000 : 0;
    const cx = w / 2, cy = h / 2, R = Math.max(140, Math.min(w, h) * .3), conv = ease(clamp(t / (reduce ? .5 : 2.4)));
    c.globalCompositeOperation = 'source-over'; c.fillStyle = 'rgba(2,6,15,.26)'; c.fillRect(0, 0, w, h);
    const sy = (t * 140) % (h + 40) - 20; c.fillStyle = 'rgba(0,210,255,.05)'; c.fillRect(0, sy, w, 2);
    for (let k = 0; k < 3; k++) { const rr = R * (.55 + k * .22) + Math.sin(t * 1.2 + k) * 4 + L * L * w; c.strokeStyle = `rgba(0,210,255,${.07 * conv * (1 - clamp(L))})`; c.lineWidth = 1; c.beginPath(); c.arc(cx, cy, rr, 0, 6.2832); c.stroke(); }
    const grow = (state === 'launch') ? 1 + L * 3 : 1, fade = 1 - clamp(L * 1.1);
    c.lineWidth = 3; c.lineCap = 'round';
    for (let i = 0; i < B; i++) {
      const ang = i / B * 6.2832 + t * .15, n = Math.abs(Math.sin(t * 2.1 + i * .55) * Math.cos(t * 1.3 + i * .23));
      const r0 = R + L * L * w * .8, len = (8 + n * 46 * grow) * conv, hue = 190 + Math.sin(i / B * 6.2832 + t) * 45;
      c.strokeStyle = `hsla(${hue},95%,${58 + n * 25}%,${(.3 + .55 * conv) * fade})`;
      c.beginPath(); c.moveTo(cx + Math.cos(ang) * r0, cy + Math.sin(ang) * r0); c.lineTo(cx + Math.cos(ang) * (r0 + len), cy + Math.sin(ang) * (r0 + len)); c.stroke();
    }
    for (const p of P) {
      const ang = p.a + t * p.s * .5 * (1 + L * 4);
      let dist = R * (1 + p.d * 2.4 * (1 - conv)) + (p.o - .5) * 16 * conv + L * L * w * .9 * p.s;
      const al = (.15 + conv * .75) * (1 - clamp(L * .9));
      c.fillStyle = `hsla(${p.hue},95%,72%,${al})`; c.beginPath(); c.arc(cx + Math.cos(ang) * dist, cy + Math.sin(ang) * dist, 1 + p.o * 1.8, 0, 6.2832); c.fill();
    }
    if (state === 'launch') {
      c.strokeStyle = `rgba(160,255,255,${Math.max(0, 1 - L * 1.1)})`; c.lineWidth = 1 + 7 * Math.max(0, 1 - L);
      c.beginPath(); c.arc(cx, cy, R + ease(clamp(L / 1.4)) * Math.hypot(w, h) * .6, 0, 6.2832); c.stroke();
    }
    if (!ready) {
      const p = Math.min(.92, t / (reduce ? .6 : 2.8) * .92); bootFill.style.width = (p * 100) + '%';
      const lines = ['LOADING SPECTRUM ENGINE', 'TUNING FREQUENCY BINS', 'SYNCING STORAGE'];
      bootLine.textContent = lines[Math.min(2, Math.floor(p * 3.2))] + '…';
    }
  }

  function release() {
    held.forEach((e, i) => setTimeout(() => e.classList.remove('intro-hold'), reduce ? 0 : i * 180));
    if (reduce) { vizGain = 1; return; }
    const t1 = performance.now(), dur = 2600;
    (function step(now) { const k = clamp((now - t1) / dur); vizGain = ease(k); if (k < 1) requestAnimationFrame(step); })(t1);
  }
  function finish() {
    if (finished) return; finished = true; cancelAnimationFrame(raf);
    el.style.display = 'none'; el.style.webkitMaskImage = el.style.maskImage = '';
    queue.splice(0).forEach(f => { try { f(); } catch {} });
  }

  async function launch(withAudio) {
    if (state !== 'boot' || !ready) return;
    state = 'wait'; startBtn.disabled = skipBtn.disabled = true;
    const audioP = withAudio ? enableRealAudio() : Promise.resolve(false);
    if (withAudio) bootLine.textContent = 'SELECT AUDIO SOURCE IN POPUP WINDOW...';
    const ok = await audioP;
    state = 'launch'; launchAt = performance.now();
    bootLine.textContent = ok ? 'AUDIO LINK ESTABLISHED' : 'AMBIENT MODE ENGAGED'; bootFill.style.width = '100%';
    if (reduce) { el.classList.add('fade-out'); release(); setTimeout(finish, 950); return; }
    content.classList.add('leaving'); flash.classList.add('go');
    await sleep(450);
    release();
    const start = performance.now(), dur = 1700, maxR = Math.hypot(w, h) / 2 + 80;
    await new Promise(res => (function step(now) {
      const k = clamp((now - start) / dur), r = ease(k) * maxR;
      el.style.webkitMaskImage = el.style.maskImage = `radial-gradient(circle at 50% 50%, transparent ${r}px, #000 ${r + 70}px)`;
      k < 1 ? requestAnimationFrame(step) : res();
    })(start));
    finish();
  }
  startBtn.addEventListener('click', () => launch(true));
  skipBtn.addEventListener('click', () => launch(false));
  addEventListener('keydown', e => { if (e.key === 'Escape' && ready && state === 'boot') launch(false); });

  return {
    start(storeP) {
      try {
        vizGain = reduce ? 1 : 0; held.forEach(e => e.classList.add('intro-hold')); raf = requestAnimationFrame(frame);
        Promise.all([sleep(reduce ? 600 : 3000), Promise.race([storeP.catch(() => {}), sleep(5000)])]).then(() => {
          ready = true; bootFill.style.width = '100%';
          bootLine.textContent = `${Store.data.favorites.length} FAVORITES RESTORED · SYSTEMS READY`;
          startBtn.classList.add('ready'); skipBtn.classList.add('ready'); startBtn.focus();
        });
      } catch (e) { console.error(e); }
    },
    whenDone(fn) { finished ? fn() : queue.push(fn); }
  };
})();

/* ---------------- APPLICATION BOOT ---------------- */
const storeReady = Store.init(refreshUI).then(r => {
  refreshUI();
  Intro.whenDone(() => {
    const n = Store.data.favorites.length;
    if (r.needsGesture) {
      setStatus('Backup folder found — click anywhere once to reconnect it.', 6000);
      const once = async () => { removeEventListener('pointerdown', once, true); const ok = await Store.reconnect(true); refreshUI(); setStatus(ok ? 'Backup folder reconnected ✔' : 'Folder not reconnected — use the 📁 button.'); };
      addEventListener('pointerdown', once, true);
    } else if (!Store.hasHandle && Store.supported) {
      setStatus(n ? `${n} favorites loaded. Tip: set a 📁 backup folder for extra safety.` : 'Tip: set a 📁 backup folder to never lose favorites.', 6000);
    }
  });
});
Intro.start(storeReady);
loop();
})();
</script>
